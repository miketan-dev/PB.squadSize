name: Deploy to Nexus Mods

on:
  push:
    branches:
      - feature/nexusmod-upload
      - master

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Creates mod zip archive
        # Racchiuso tra virgolette per gestire gli spazi nel nome
        run: zip -r "Squad_Size_Mod_2.0.zip" . -x "*.git*" ".github/*"

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: 69
          file_id: 352
          filename: "Squad_Size_Mod_2.0.zip"
          version: "2.0.3"
          display_name: "Squad Size Mod v2.0"
          category: main